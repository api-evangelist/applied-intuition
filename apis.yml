aid: applied-intuition
name: Applied Intuition
description: 'Applied Intuition builds physical AI software and simulation infrastructure
  for autonomous systems across automotive, defense, trucking, mining, construction,
  and agriculture. Its end-to-end stack spans a Self-Driving System (SDS), a Vehicle
  OS, and tools for vehicle intelligence, letting teams develop, simulate, test, validate,
  and deploy autonomy at scale. Applied Intuition sells enterprise autonomy software
  to OEMs and defense programs; it does not publish a public developer REST/GraphQL
  API, SDK, or developer portal, so this profile captures the company identity plus
  its public web, security, and open-source surfaces for the API Evangelist network.'
